name: rtf_campo
description: RTF 2.0 - App de campo para visitadores
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  connectivity_plus: ^6.0.5
  google_maps_flutter: ^2.9.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true